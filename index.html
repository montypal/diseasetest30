<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Detectives - Interactive Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            margin: 0;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 800px;
            margin: 0 auto 20px auto;
            padding: 10px 20px;
            background: #2c3e50;
            color: white;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .header h2 {
            margin: 0;
            font-size: 1.2rem;
        }
        .score-tracker {
            font-weight: bold;
            font-size: 1.2rem;
            background: #e74c3c;
            padding: 5px 15px;
            border-radius: 20px;
        }
        .quiz-container {
            max-width: 800px;
            margin: 0 auto;
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            min-height: 300px;
            position: relative;
        }
        .question-text {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            color: #2c3e50;
        }
        .options-container label {
            display: block;
            margin-bottom: 12px;
            padding: 10px;
            background: #fdfdfd;
            border: 1px solid #ddd;
            border-radius: 4px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .options-container label:hover {
            background: #f1f8ff;
            border-color: #3498db;
        }
        .options-container input[type="radio"] {
            margin-right: 10px;
        }
        .write-in-input {
            width: 100%;
            padding: 12px;
            font-size: 1rem;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
            margin-bottom: 20px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-top: 30px;
            border-top: 1px solid #eee;
            padding-top: 20px;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            transition: opacity 0.3s;
            font-weight: bold;
        }
        button:hover {
            opacity: 0.9;
        }
        .btn-next {
            background-color: #3498db;
            color: white;
        }
        .btn-end {
            background-color: #95a5a6;
            color: white;
        }
        #results {
            text-align: center;
            display: none;
        }
        .final-score {
            font-size: 2rem;
            color: #2c3e50;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="header">
        <h2>Disease Detectives</h2>
        <div class="score-tracker" id="scoreTracker">Score: 0</div>
    </div>

    <div class="quiz-container" id="quizContainer">
        <div id="questionArea">
            <div class="question-text" id="questionText">Loading question...</div>
            <div class="options-container" id="optionsContainer">
                </div>
        </div>
        
        <div class="controls" id="controls">
            <button class="btn-end" onclick="endTest()">End Test Early</button>
            <button class="btn-next" id="nextBtn" onclick="nextQuestion()">Next Question</button>
        </div>

        <div id="results">
            <h2>Test Complete!</h2>
            <div class="final-score" id="finalScoreText"></div>
            <p id="feedbackText"></p>
            <button class="btn-next" onclick="location.reload()">Retake Test</button>
        </div>
    </div>

    <script>
        // Question Bank derived from the document
        const sourceQuestions = [
            {
                type: "mcq",
                question: "What is a key difference between a propagated and a point source outbreak?",
                options: [
                    "A) Point source has multiple waves of infection; propagated has one.",
                    "B) Propagated transmission is via an intermediate host only.",
                    "C) Point source has a common source; propagated passes person-to-person with irregular peaks.",
                    "D) Point source affects only animals; propagated affects humans."
                ],
                answer: "C) Point source has a common source; propagated passes person-to-person with irregular peaks."
            },
            {
                type: "mcq",
                question: "Distinguish between the terms prevalence and incidence.",
                options: [
                    "A) Incidence is existing cases; prevalence is new cases.",
                    "B) Incidence measures new cases over time; prevalence measures existing cases at a given point.",
                    "C) Incidence applies to chronic diseases; prevalence to infectious ones.",
                    "D) There is no functional difference in epidemiology."
                ],
                answer: "B) Incidence measures new cases over time; prevalence measures existing cases at a given point."
            },
            {
                type: "write-in",
                question: "If an individual is infected with influenza but exhibits no symptoms, what is this state called?",
                answer: "asymptomatic" // Graded case-insensitively
            },
            {
                type: "mcq",
                question: "Anthrax cases are maintained in cattle and wild deer populations at all times. What is this considered?",
                options: [
                    "A) Pandemic",
                    "B) Epidemic",
                    "C) Endemic",
                    "D) Propagated"
                ],
                answer: "C) Endemic"
            },
            {
                type: "write-in",
                question: "In 2001, there were a series of threats using powdered anthrax. What was the method of delivery?",
                answer: "letters"
            },
            {
                type: "mcq",
                question: "Can epidemics be caused by non-infectious agents?",
                options: [
                    "A) No, epidemics require a viral or bacterial agent.",
                    "B) Yes, examples include diabetes and obesity.",
                    "C) Yes, but only in isolated geographic areas.",
                    "D) No, non-infectious diseases are considered endemic only."
                ],
                answer: "B) Yes, examples include diabetes and obesity."
            },
            {
                type: "mcq",
                question: "If 350 people contract typhoid fever out of a group of 500 people living in a specific area, what is the attack rate?",
                options: [
                    "A) 35%",
                    "B) 50%",
                    "C) 70%",
                    "D) 85%"
                ],
                answer: "C) 70%"
            },
            {
                type: "mcq",
                question: "What is the difference between primordial and primary level prevention?",
                options: [
                    "A) Primordial avoids developing risk factors entirely; primary manages existing risk factors to prevent disease.",
                    "B) Primary avoids developing risk factors; primordial cures the disease.",
                    "C) Primordial focuses on vaccination; primary focuses on quarantine.",
                    "D) They are synonymous terms in public health."
                ],
                answer: "A) Primordial avoids developing risk factors entirely; primary manages existing risk factors to prevent disease."
            },
            {
                type: "mcq",
                question: "In a case-control study, if there are 90 exposed cases, 10 unexposed cases, 15 exposed controls, and 85 unexposed controls, what is the odds ratio?",
                options: [
                    "A) 9",
                    "B) 0.17",
                    "C) 15",
                    "D) 51"
                ],
                answer: "D) 51"
            },
            {
                type: "mcq",
                question: "What is the difference between elimination and eradication?",
                options: [
                    "A) Elimination reduces worldwide incidence to zero; eradication is localized.",
                    "B) Elimination reduces incidence to zero in a specific area but requires ongoing intervention; eradication is worldwide and needs no intervention.",
                    "C) Elimination refers to the vector; eradication refers to the pathogen.",
                    "D) Elimination requires vaccines; eradication requires sanitation."
                ],
                answer: "B) Elimination reduces incidence to zero in a specific area but requires ongoing intervention; eradication is worldwide and needs no intervention."
            }
        ];

        // State Variables
        let questions = [];
        let currentQuestionIndex = 0;
        let score = 0;
        let testEnded = false;

        // Shuffle function (Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // Initialize Test
        function startTest() {
            questions = [...sourceQuestions]; // Copy array
            shuffleArray(questions); // Randomize order
            currentQuestionIndex = 0;
            score = 0;
            testEnded = false;
            updateScoreDisplay();
            renderQuestion();
        }

        // Render Current Question
        function renderQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endTest();
                return;
            }

            const q = questions[currentQuestionIndex];
            document.getElementById('questionText').innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}: ${q.question}`;
            
            const optionsContainer = document.getElementById('optionsContainer');
            optionsContainer.innerHTML = ''; // Clear previous

            if (q.type === 'mcq') {
                // Shuffle options for MCQ
                let shuffledOptions = [...q.options];
                shuffleArray(shuffledOptions);

                shuffledOptions.forEach((opt, index) => {
                    const label = document.createElement('label');
                    const radio = document.createElement('input');
                    radio.type = 'radio';
                    radio.name = 'answer';
                    radio.value = opt;
                    
                    label.appendChild(radio);
                    label.appendChild(document.createTextNode(opt));
                    optionsContainer.appendChild(label);
                });
            } else if (q.type === 'write-in') {
                const input = document.createElement('input');
                input.type = 'text';
                input.id = 'writeInAnswer';
                input.className = 'write-in-input';
                input.placeholder = 'Type your answer here...';
                optionsContainer.appendChild(input);
            }

            // Update Next button text if it's the last question
            const nextBtn = document.getElementById('nextBtn');
            if (currentQuestionIndex === questions.length - 1) {
                nextBtn.innerText = "Submit Final Answer";
            } else {
                nextBtn.innerText = "Next Question";
            }
        }

        // Handle "Next" click
        function nextQuestion() {
            if (testEnded) return;

            const q = questions[currentQuestionIndex];
            let isCorrect = false;

            if (q.type === 'mcq') {
                const selected = document.querySelector('input[name="answer"]:checked');
                if (!selected) {
                    alert("Please select an answer before moving on.");
                    return;
                }
                if (selected.value === q.answer) {
                    isCorrect = true;
                }
            } else if (q.type === 'write-in') {
                const inputVal = document.getElementById('writeInAnswer').value.trim().toLowerCase();
                if (inputVal === "") {
                    alert("Please type an answer before moving on.");
                    return;
                }
                // Check if the typed answer includes the key word
                if (inputVal.includes(q.answer.toLowerCase())) {
                    isCorrect = true;
                }
            }

            // Real-time score update
            if (isCorrect) {
                score++;
                updateScoreDisplay();
            }

            currentQuestionIndex++;
            renderQuestion();
        }

        function updateScoreDisplay() {
            document.getElementById('scoreTracker').innerText = `Score: ${score}`;
        }

        // End the test and show results
        function endTest() {
            testEnded = true;
            document.getElementById('questionArea').style.display = 'none';
            document.getElementById('controls').style.display = 'none';
            
            const resultsDiv = document.getElementById('results');
            resultsDiv.style.display = 'block';
            
            document.getElementById('finalScoreText').innerText = `${score} / ${currentQuestionIndex === 0 ? questions.length : currentQuestionIndex} Correct`;
            
            let percentage = currentQuestionIndex === 0 ? 0 : Math.round((score / currentQuestionIndex) * 100);
            
            let feedback = "";
            if (percentage >= 90) feedback = "Outstanding work!";
            else if (percentage >= 70) feedback = "Good job, but there's room to review a few concepts.";
            else feedback = "Keep studying the terminology and calculations. You'll get there!";
            
            document.getElementById('feedbackText').innerText = feedback;
        }

        // Start the test when the page loads
        window.onload = startTest;
    </script>

</body>
</html>
